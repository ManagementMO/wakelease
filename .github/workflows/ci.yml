name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Swift format and lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Check with pinned tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/lint.py

  test:
    name: Core and package safety (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Select latest Xcode and record the platform
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
      - name: Diagnostic cleanup preserves recovery after failures
        run: |
          python3 Tests/service_approval_safety.py
          git status --short --untracked-files=all
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Swift invariants and fake controllers
        env:
          WAKELEASE_SOURCE_TESTING: "1"
        run: swift test --scratch-path .build/source-testing --disable-xctest --disable-experimental-prebuilts
      - name: Optimized Swift invariants and fake controllers
        env:
          WAKELEASE_SOURCE_TESTING: "1"
        run: swift test --scratch-path .build/source-testing --configuration release --disable-xctest --disable-experimental-prebuilts
      - name: Root-owned removal ticket permissions in a disposable directory
        env:
          WAKELEASE_ROOT_FIXTURE: "1"
          WAKELEASE_SOURCE_TESTING: "1"
        run: |
          swift build --scratch-path .build/source-testing --disable-experimental-prebuilts --product WakeLeaseRemovalProbe
          python3 Tests/root_removal_smoke.py
      - name: Owned ad-hoc XPC identity and authorization boundaries
        env:
          WAKELEASE_SOURCE_TESTING: "1"
        run: |
          swift build --scratch-path .build/source-testing --disable-experimental-prebuilts --product WakeLeaseXPCProbe
          python3 Tests/xpc_smoke.py
      - name: Command and simulation daemon integration
        run: python3 Tests/cli_integration.py
      - name: Simulated idle footprint regression
        run: python3 Tests/idle_smoke.py
      - name: Pinned Pi SDK offline lifecycle contract
        env:
          WAKELEASE_REQUIRE_PI_HOST: "1"
        run: |
          python3 Scripts/install-host-fixtures.py
          python3 Tests/pi_host_smoke.py
      - name: Optimized CLI, XPC, offline host and idle checks
        env:
          WAKELEASE_BIN_DIR: .build/source-testing/release
          WAKELEASE_REQUIRE_PI_HOST: "1"
        run: |
          python3 Tests/cli_integration.py
          python3 Tests/xpc_smoke.py
          python3 Tests/pi_host_smoke.py
          python3 Tests/idle_smoke.py
      - name: Disposable ad-hoc bundle and privileged-mode refusal
        env:
          WAKELEASE_HEADLESS: "1"
        run: python3 Tests/package_smoke.py
      - name: Installer-required bundle and exact component verification
        run: python3 Tests/community_package_smoke.py
      - name: Universal development package
        run: python3 Scripts/build-app.py --configuration release --sign - --arch arm64 --arch x86_64 --output .build/universal/WakeLease.app --zip
      - name: Build community installer candidate without installing it
        if: matrix.runner == 'macos-26'
        run: |
          python3 Scripts/build-app.py --community --configuration release --sign - --arch arm64 --arch x86_64 --output .build/community/WakeLease.app
          python3 Scripts/build-community.py --app .build/community/WakeLease.app --output .build/community-distribution
          WAKELEASE_COMMUNITY_DIST=.build/community-distribution WAKELEASE_REQUIRE_UNIVERSAL_DMG=1 WAKELEASE_HEADLESS=1 python3 Tests/package_smoke.py
      - name: Strict C syntax
        run: clang -fsyntax-only -Wall -Wextra -Werror -I AdrafinilShared/Sources/WakeLeaseProcess/include AdrafinilShared/Sources/WakeLeaseProcess/WakeLeaseProcess.c AdrafinilShared/Sources/WakeLeaseProcess/BoundedProcess.c AdrafinilShared/Sources/WakeLeaseProcess/RemovalPermissions.c
      - name: Native accessibility harness typecheck
        run: swiftc -typecheck Tests/ui_accessibility.swift
      - name: Release-tool argument safety
        run: python3 Tests/release_tools.py
      - name: Repository and documentation checks
        run: python3 Scripts/check-repository.py
      - name: Retain universal development archive
        if: matrix.runner == 'macos-26'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: WakeLease-universal-development-no-privilege
          path: |
            .build/universal/WakeLease.zip
            .build/universal/WakeLease.zip.sha256
          retention-days: 7
          if-no-files-found: error
      - name: Retain community installer candidate
        if: matrix.runner == 'macos-26'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: WakeLease-community-installer-preview
          path: .build/community-distribution/
          retention-days: 7
          if-no-files-found: error

  process_xpc:
    name: Remote cross-process XPC (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      WAKELEASE_SOURCE_TESTING: "1"
      WAKELEASE_XPC_PROCESS_FIXTURE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Select the disposable toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sw_vers
          swift --version
      - name: Build harmless cross-process fixture
        run: swift build --scratch-path .build/source-testing --disable-experimental-prebuilts --product WakeLeaseXPCProcessProbe
      - name: Verify exact role and hash requirements between processes
        run: python3 Tests/xpc_process_smoke.py
      - name: Build optimized cross-process fixture
        run: swift build --scratch-path .build/source-testing --configuration release --disable-experimental-prebuilts --product WakeLeaseXPCProcessProbe
      - name: Verify optimized cross-process requirements
        env:
          WAKELEASE_BIN_DIR: .build/source-testing/release
        run: python3 Tests/xpc_process_smoke.py

  preview:
    name: Remote native previews (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      WAKELEASE_SOURCE_TESTING: "1"
      WAKELEASE_REQUIRE_UI_AUDIT: "1"
      WAKELEASE_UI_ARTIFACT_DIR: .build/ui-evidence/debug
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Select the disposable toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sw_vers
          xcodebuild -version
      - name: Build preview-only application
        run: swift build --scratch-path .build/source-testing --disable-experimental-prebuilts --product WakeLeaseMenu
      - name: Render previews and audit with existing permissions only
        run: python3 Tests/ui_smoke.py
      - name: Build optimized preview-only application
        run: swift build --scratch-path .build/source-testing --configuration release --disable-experimental-prebuilts --product WakeLeaseMenu
      - name: Audit optimized native UI with existing permissions only
        env:
          WAKELEASE_BIN_DIR: .build/source-testing/release
          WAKELEASE_UI_ARTIFACT_DIR: .build/ui-evidence/release
        run: python3 Tests/ui_smoke.py
      - name: Retain preview evidence and permission limitations
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: WakeLease-remote-ui-${{ matrix.runner }}
          path: .build/ui-evidence/
          retention-days: 7
          if-no-files-found: warn

  artifact_roundtrip:
    name: Verify downloaded universal installer artifact
    needs: test
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Download this run's community installer candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: WakeLease-community-installer-preview
          path: .build/downloaded-community
          digest-mismatch: error
      - name: Reverify downloaded signatures, provenance, slices and checksums
        env:
          WAKELEASE_COMMUNITY_DIST: .build/downloaded-community
          WAKELEASE_REQUIRE_UNIVERSAL_DMG: "1"
        run: python3 Tests/package_smoke.py CommunityArtifactSmoke

  build:
    name: Full unsigned Xcode build (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Select latest Xcode and record the platform
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
      # Compile-only check — no signing identities on CI. The daemon/helper/CLI are embedded in the
      # app target, so building the Adrafinil scheme covers all four products.
      - name: Build WakeLease products
        run: |
          xcodebuild -project Adrafinil.xcodeproj -scheme Adrafinil -configuration Debug \
            -destination 'generic/platform=macOS' -derivedDataPath .build/xcode \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
      - name: Retain unsigned compile artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: WakeLease-unsigned-compile-only-${{ matrix.runner }}
          path: .build/xcode/Build/Products/Debug/WakeLease.app
          retention-days: 7
          if-no-files-found: error

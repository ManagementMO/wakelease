name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Swift format and lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Check with pinned tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/lint.py

  test:
    name: Core and package safety (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Select latest Xcode and record the platform
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
      - name: Swift invariants and fake controllers
        env:
          WAKELEASE_SOURCE_TESTING: "1"
        run: swift test --scratch-path .build/source-testing --disable-xctest --disable-experimental-prebuilts
      - name: Root-owned removal ticket permissions in a disposable directory
        env:
          WAKELEASE_ROOT_FIXTURE: "1"
          WAKELEASE_SOURCE_TESTING: "1"
        run: |
          swift build --scratch-path .build/source-testing --disable-experimental-prebuilts --product WakeLeaseRemovalProbe
          python3 Tests/root_removal_smoke.py
      - name: Owned ad-hoc XPC identity and authorization boundaries
        env:
          WAKELEASE_SOURCE_TESTING: "1"
        run: |
          swift build --scratch-path .build/source-testing --disable-experimental-prebuilts --product WakeLeaseXPCProbe
          python3 Tests/xpc_smoke.py
      - name: Command and simulation daemon integration
        run: python3 Tests/cli_integration.py
      - name: Simulated idle footprint regression
        run: python3 Tests/idle_smoke.py
      - name: Pinned Pi SDK offline lifecycle contract
        env:
          WAKELEASE_REQUIRE_PI_HOST: "1"
        run: |
          python3 Scripts/install-host-fixtures.py
          python3 Tests/pi_host_smoke.py
      - name: Disposable ad-hoc bundle and privileged-mode refusal
        env:
          WAKELEASE_HEADLESS: "1"
        run: python3 Tests/package_smoke.py
      - name: Universal development package
        run: python3 Scripts/build-app.py --configuration release --sign - --arch arm64 --arch x86_64 --output .build/universal/WakeLease.app --zip
      - name: Strict C syntax
        run: clang -fsyntax-only -Wall -Wextra -Werror -I AdrafinilShared/Sources/WakeLeaseProcess/include AdrafinilShared/Sources/WakeLeaseProcess/WakeLeaseProcess.c AdrafinilShared/Sources/WakeLeaseProcess/BoundedProcess.c AdrafinilShared/Sources/WakeLeaseProcess/RemovalPermissions.c
      - name: Native accessibility harness typecheck
        run: swiftc -typecheck Tests/ui_accessibility.swift
      - name: Release-tool argument safety
        run: python3 Tests/release_tools.py
      - name: Repository and documentation checks
        run: python3 Scripts/check-repository.py
      - name: Retain universal development archive
        if: matrix.runner == 'macos-26'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: WakeLease-universal-development-no-privilege
          path: |
            .build/universal/WakeLease.zip
            .build/universal/WakeLease.zip.sha256
          retention-days: 7
          if-no-files-found: error

  build:
    name: Full unsigned Xcode build (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Select latest Xcode and record the platform
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sw_vers
          uname -m
          xcodebuild -version
          swift --version
      # Compile-only check — no signing identities on CI. The daemon/helper/CLI are embedded in the
      # app target, so building the Adrafinil scheme covers all four products.
      - name: Build WakeLease products
        run: |
          xcodebuild -project Adrafinil.xcodeproj -scheme Adrafinil -configuration Debug \
            -destination 'generic/platform=macOS' -derivedDataPath .build/xcode \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
      - name: Retain unsigned compile artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: WakeLease-unsigned-compile-only-${{ matrix.runner }}
          path: .build/xcode/Build/Products/Debug/WakeLease.app
          retention-days: 7
          if-no-files-found: error
